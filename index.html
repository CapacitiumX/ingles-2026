<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master English: Interactive Learning</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; margin: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="english-sentence">Haz clic para empezar</h2>
    <img id="visual-cue" src="https://via.placeholder.com/500x250" alt="Contexto">
    <button onclick="generarNuevaLeccion()">Siguiente Desafío</button>
    <button onclick="hablar()">Escuchar Pronunciación</button>
</div>

<script>
    // Banco de datos (puedes ampliarlo)
    const sujetos = ["The clever engineer", "A curious traveler", "The fast runner", "My best friend"];
    const verbos = ["is analyzing", "is exploring", "is planning", "is learning"];
    const objetos = ["the complex code", "the hidden path", "a new strategy", "the secret language"];
    
    let ultimaFrase = "";

    function generarNuevaLeccion() {
        let frase;
        do {
            const s = sujetos[Math.floor(Math.random() * sujetos.length)];
            const v = verbos[Math.floor(Math.random() * verbos.length)];
            const o = objetos[Math.floor(Math.random() * objetos.length)];
            frase = `${s} ${v} ${o}.`;
        } while (frase === ultimaFrase);

        ultimaFrase = frase;
        document.getElementById('english-sentence').innerText = frase;
        
        // Cargar imagen aleatoria relacionada con la acción
        document.getElementById('visual-cue').src = `https://source.unsplash.com/500x250/?${frase.split(' ')[1]}`;
    }

    function hablar() {
        const msg = new SpeechSynthesisUtterance(ultimaFrase);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
