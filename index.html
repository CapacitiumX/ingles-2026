<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>English Mastery Pro - Inmersión Total</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 600px; background: #16213e; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #image-box { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin-bottom: 20px; }
        .sentence { font-size: 1.5rem; font-weight: bold; color: #4ecca3; margin-bottom: 10px; }
        .phonetic { font-style: italic; color: #e94560; margin-bottom: 15px; }
        .grammar-box { background: #0f3460; padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 0.9rem; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-next { background: #4ecca3; color: #16213e; }
        .btn-speak { background: #e94560; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <img id="image-box" src="https://images.unsplash.com/photo-1546410531-bb4caa6b424d" alt="Visual">
    <div id="english-sentence" class="sentence">Click 'Next' to start your journey.</div>
    <div id="phonetic-guide" class="phonetic"></div>
    <div class="grammar-box" id="grammar-info">Esperando datos...</div>
    
    <div class="btn-group">
        <button class="btn-next" onclick="nextLesson()">Siguiente Lección</button>
        <button class="btn-speak" onclick="speak()">Pronunciación</button>
    </div>
</div>

<script>
    const lessonData = [
        { eng: "The engineer designs complex software.", phon: "/ðə ɛndʒɪˈnɪər dɪˈzaɪnz ˈkɒmplɛks ˈsɒftwɛər/", gram: "Sujeto: The engineer | Verbo: designs (3ra pers) | Objeto: complex software" },
        { eng: "Strategic planning improves business performance.", phon: "/strəˈtiːdʒɪk ˈplænɪŋ ɪmˈpruːvz ˈbɪznɪs pəˈfɔːməns/", gram: "Sujeto: Strategic planning | Verbo: improves | Objeto: business performance" },
        { eng: "Fluency requires consistent daily practice.", phon: "/ˈfluːənsi rɪˈkwaɪərz kənˈsɪstənt ˈdeɪli ˈpræktɪs/", gram: "Sujeto: Fluency | Verbo: requires | Objeto: consistent daily practice" }
    ];

    let currentIndex = 0;

    function nextLesson() {
        currentIndex = (currentIndex + 1) % lessonData.length;
        const data = lessonData[currentIndex];
        
        document.getElementById('english-sentence').innerText = data.eng;
        document.getElementById('phonetic-guide').innerText = data.phon;
        document.getElementById('grammar-info').innerText = data.gram;
        document.getElementById('image-box').src = `https://source.unsplash.com/600x400/?${data.eng.split(' ')[1]}`;
    }

    function speak() {
        const msg = new SpeechSynthesisUtterance(document.getElementById('english-sentence').innerText);
        msg.lang = 'en-US';
        msg.rate = 0.8; // Más lento para notar la articulación
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
